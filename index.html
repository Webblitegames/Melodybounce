<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MelodyBounce</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#d9d9d9;font-family:Arial,sans-serif;color:#171717}body{min-height:100vh}
#app{width:min(100vw,600px);min-height:100vh;margin:auto;background:#e8e8e8;position:relative;overflow:hidden}
header{padding:18px 16px 10px;text-align:center}h1{margin:0;font-size:30px}#sub{font-size:13px;font-weight:700;color:#555;margin-top:4px}
#panel{margin:0 12px 10px;padding:12px;background:#ffffffd9;border:2px solid #222;border-radius:14px;position:relative;z-index:5}
.row{display:flex;gap:8px;flex-wrap:wrap}.btn,label.btn{flex:1;min-width:125px;text-align:center;border:0;border-radius:10px;padding:12px 10px;background:#161616;color:white;font-weight:900;font-size:14px}
button:disabled{opacity:.4}input[type=file]{display:none}
#status{margin-top:9px;font-size:12px;font-weight:800;min-height:30px;line-height:1.35}
#meter{height:7px;background:#ccc;border-radius:9px;overflow:hidden;margin-top:7px}#meter>div{height:100%;width:0;background:#222;transition:width .15s}
#stats{display:flex;justify-content:space-between;font-size:11px;font-weight:900;margin-top:8px}
canvas{display:block;width:100%;height:auto;background:#eee}
#hint{text-align:center;font-size:11px;font-weight:bold;padding:7px;color:#555}
</style></head>
<body><div id="app">
<header><h1>MELODYBOUNCE</h1><div id="sub">Two stems → two synchronized bounce melodies</div></header>
<div id="panel">
 <div class="row">
  <label class="btn">VOCALS<input id="vocalFile" type="file" accept=".mp3,.m4a,.wav,.aac,.ogg,.flac,audio/*"></label>
  <label class="btn">INSTRUMENTAL<input id="instFile" type="file" accept=".mp3,.m4a,.wav,.aac,.ogg,.flac,audio/*"></label>
  <button class="btn" id="analyze" disabled>BUILD</button>
 </div>
 <div class="row" style="margin-top:8px"><button class="btn" id="play" disabled>PLAY</button><button class="btn" id="regen" disabled>NEW COURSE</button></div>
 <div style="margin-top:10px">
  <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:900"><span>START POINT</span><span id="startLabel">0:00</span></div>
  <input id="startRange" type="range" min="0" max="0" value="0" step="0.1" style="width:100%;margin-top:6px">
  <div class="row" style="margin-top:5px"><button class="btn" id="back15" disabled>−15 SEC</button><button class="btn" id="forward15" disabled>+15 SEC</button></div>
 </div>
 <div id="status">Choose the VOCALS stem and INSTRUMENTAL stem.</div><div id="meter"><div></div></div>
 <div id="stats"><span id="name">NEED 2 FILES</span><span id="notes">0 EVENTS</span></div>
</div>
<canvas id="c" width="600" height="820"></canvas><div id="hint">V1 browser prototype · headphones recommended</div>
</div>
<script>
const VF=document.getElementById('vocalFile'),IF=document.getElementById('instFile'),A=document.getElementById('analyze'),P=document.getElementById('play'),R=document.getElementById('regen');
const S=document.getElementById('status'),M=document.querySelector('#meter div'),N=document.getElementById('name'),NS=document.getElementById('notes');
const SR=document.getElementById('startRange'),SL=document.getElementById('startLabel'),B15=document.getElementById('back15'),F15=document.getElementById('forward15');
const C=document.getElementById('c'),X=C.getContext('2d');
let ctx,vocalBuf=null,instBuf=null,buf=null,events=[],instEvents=[],course=[],instCourse=[],src=null,start=0,raf=0,playing=false,fileName='',master=null,synth=null,startOffset=0;
const set=(s,p=0)=>{S.textContent=s;M.style.width=p+'%'};
async function loadAudio(input,kind){
 const f=input.files&&input.files[0];if(!f)return;
 try{
  ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
  if(!master){master=ctx.createGain();master.gain.value=1;master.connect(ctx.destination)}
  set('Loading '+kind+'…',25);const ab=await f.arrayBuffer();const b=await ctx.decodeAudioData(ab.slice(0));
  if(kind==='vocals')vocalBuf=b;else instBuf=b;
  if(instBuf){SR.max=Math.max(0,instBuf.duration-.05);B15.disabled=false;F15.disabled=false}
  N.textContent=(vocalBuf?'VOCALS ✓ ':'')+(instBuf?'INSTRUMENTAL ✓':'');
  A.disabled=!(vocalBuf&&instBuf);P.disabled=true;
  set(vocalBuf&&instBuf?'Both stems loaded. Tap BUILD.':'Now choose the other stem.',50);
 }catch(err){set('Could not decode '+kind+': '+(err.message||err),0)}
}
VF.onchange=()=>loadAudio(VF,'vocals');IF.onchange=()=>loadAudio(IF,'instrumental');
A.onclick=async()=>{
 if(!vocalBuf||!instBuf)return; A.disabled=true;P.disabled=true;R.disabled=true;
 set('Finding vocal-like melody events…',60);
 await new Promise(r=>setTimeout(r,30));
 events=analyze(vocalBuf,'vocal');instEvents=analyze(instBuf,'instrumental');buf=instBuf; NS.textContent=events.length+' V / '+instEvents.length+' I'; buildCourse();
 set(events.length&&instEvents.length?'Ready. Both stems are now bounce melodies.':'Not enough notes found in one of the stems.',100);
 P.disabled=!events.length;R.disabled=!events.length;A.disabled=false;draw(0);
};
function analyze(b,mode='vocal'){
 const sr=b.sampleRate,ch=b.numberOfChannels,L=b.length;
 const mono=new Float32Array(L);for(let c=0;c<ch;c++){let d=b.getChannelData(c);for(let i=0;i<L;i++)mono[i]+=d[i]/ch}
 const hop=Math.max(256,Math.round(sr*.018)),win=Math.max(1024,Math.round(sr*.045));
 let env=[],prev=0;
 for(let s=0;s+win<L;s+=hop){
  let sum=0,z=0,last=mono[s];for(let i=s;i<s+win;i+=2){let v=mono[i];sum+=v*v;if((v>=0)!=(last>=0))z++;last=v}
  let rms=Math.sqrt(sum/(win/2)),flux=Math.max(0,rms-prev);prev=rms*.72+prev*.28;
  env.push({t:s/sr,r:rms,f:flux,z:z/(win/2)});
 }
 let fs=env.map(q=>q.f).sort((a,b)=>a-b),thr=(fs[Math.floor(fs.length*.78)]||.01)*1.15,out=[],lastT=-1;
 for(let i=2;i<env.length-2;i++){
  let q=env[i]; if(q.f>thr&&q.f>=env[i-1].f&&q.f>=env[i+1].f&&q.r>.012&&q.t-lastT>.095){
   // zero crossing gives a coarse pitch-ish feature; intentionally favors human-voice range
   let hz=Math.max(90,Math.min(900,q.z*sr/2));
   let midi=69+12*Math.log2(hz/440);
   out.push({t:q.t,p:midi,str:Math.min(1,q.f/(thr*3))});lastT=q.t;
  }
 }
 // remove extreme machine-gun detections while preserving vocal runs
 let gap=mode==='instrumental'?.13:.07;
 return out.filter((q,i)=>i==0||q.t-out[i-1].t>gap).slice(0,1600);
}
function makeCourse(ev,baseX,flip){
 let out=[],x=baseX,y=690,dir=flip?-1:1;
 for(let i=0;i<ev.length;i++){
  let dt=i?ev[i].t-ev[i-1].t:.3;
  let pitch=(ev[i].p-60)/24;
  x=baseX+dir*(65+Math.min(80,dt*85))+Math.max(-30,Math.min(30,pitch*25));
  x=Math.max(70,Math.min(530,x));y-=Math.max(72,Math.min(145,78+dt*70));
  out.push({x,y,t:ev[i].t,p:ev[i].p,str:ev[i].str});dir*=-1;
 }return out;
}
function buildCourse(){course=makeCourse(events,215,false);instCourse=makeCourse(instEvents,385,true)}
R.onclick=()=>{buildCourse();draw(0)};
P.onclick=async()=>{
 if(!buf)return;if(playing){stop();return}
 if(!ctx) return;
 try{
   await ctx.resume();
   // iPhone/Safari audio unlock: create a tiny silent buffer from this user gesture.
   const unlock=ctx.createBuffer(1,1,ctx.sampleRate),u=ctx.createBufferSource();
   u.buffer=unlock;u.connect(master||ctx.destination);u.start(0);
 }catch(e){set('Audio could not start: '+(e.message||e),100);return}
 src=ctx.createBufferSource();src.buffer=buf;
 if(!master){master=ctx.createGain();master.gain.value=1;master.connect(ctx.destination)}
 // Source is used only as a silent timing clock; original stems are not heard.
 const silent=ctx.createGain();silent.gain.value=0;src.connect(silent);silent.connect(master);start=ctx.currentTime-startOffset;
 nextNote=0;nextInstNote=0;
 while(nextNote<events.length&&events[nextNote].t<startOffset)nextNote++;
 while(nextInstNote<instEvents.length&&instEvents[nextInstNote].t<startOffset)nextInstNote++;
 let va=pathPos(course,startOffset),ia=pathPos(instCourse,startOffset);camY=410-(va.y+ia.y)/2;src.start(0,startOffset);playing=true;P.textContent='STOP';src.onended=stop;tick();
};
function stop(){if(src){try{src.stop()}catch(e){}src=null}playing=false;P.textContent='PLAY';cancelAnimationFrame(raf);draw(startOffset)}
let nextNote=0,nextInstNote=0;
function bounceTone(midi,str=1){
 const now=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
 o.type='triangle';o.frequency.value=440*Math.pow(2,(Math.round(midi)-69)/12);
 g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.16+str*.12,now+.006);g.gain.exponentialRampToValueAtTime(.0001,now+.22);
 o.connect(g);g.connect(master);o.start(now);o.stop(now+.24);
}
function tick(){if(!playing)return;let t=ctx.currentTime-start;
 while(nextNote<events.length&&events[nextNote].t<=t+.025){bounceTone(events[nextNote].p,events[nextNote].str);nextNote++}
 while(nextInstNote<instEvents.length&&instEvents[nextInstNote].t<=t+.025){bounceTone(instEvents[nextInstNote].p,instEvents[nextInstNote].str*.72);nextInstNote++}
 draw(t);if(t<buf.duration){SR.value=t;SL.textContent=fmt(t);raf=requestAnimationFrame(tick)}else stop()}
let camY=0;
function pathPos(path,t){
 if(!path.length)return{x:300,y:690,k:0};
 let i=0;while(i+1<path.length&&path[i+1].t<=t)i++;
 let a=i?path[i-1]:{x:path[0].x,y:690,t:0},b=path[i]||a,dt=Math.max(.001,b.t-a.t),u=Math.max(0,Math.min(1,(t-a.t)/dt));
 return{x:a.x+(b.x-a.x)*u,y:a.y+(b.y-a.y)*u-95*Math.sin(Math.PI*u)*Math.min(1,dt/.45),k:i};
}

function cameraFor(t){
 let a=pathPos(course,t),b=pathPos(instCourse,t),mid=(a.y+b.y)/2,target=410-mid;
 if(!playing){camY=target;return camY}camY+=(target-camY)*.14;return camY;
}
function drawPath(path,cam,label){
 X.lineCap='round';
 for(let i=0;i<path.length;i++){let q=path[i];if(q.y+cam<-100||q.y+cam>900)continue;let side=i%2?-1:1,len=105;
  X.strokeStyle='#282828';X.lineWidth=13;X.beginPath();X.moveTo(q.x-side*12,q.y+7);X.lineTo(q.x+side*len,q.y-22);X.stroke();
  X.fillStyle='#555';X.font='bold 10px Arial';X.textAlign='center';X.fillText(noteName(q.p),q.x,q.y+27);
 }
}
function ball(path,t,fill){
 let b=pathPos(path,t);X.shadowBlur=15;X.shadowColor=fill;X.fillStyle=fill;X.beginPath();X.arc(b.x,b.y,17,0,Math.PI*2);X.fill();X.shadowBlur=0;X.lineWidth=4;X.strokeStyle='#111';X.stroke();return b;
}
function draw(t){
 X.clearRect(0,0,600,820);X.fillStyle='#ddd';X.fillRect(0,0,600,820);
 let cam=cameraFor(t);X.save();X.translate(0,cam);
 X.fillStyle='#f2f2f2';X.fillRect(30,-Math.max(course.length,instCourse.length)*160-500,540,Math.max(course.length,instCourse.length)*160+1400);
 X.strokeStyle='#c51e27';X.lineWidth=7;X.strokeRect(32,-Math.max(course.length,instCourse.length)*160-500,536,Math.max(course.length,instCourse.length)*160+1400);
 drawPath(course,cam,'V');drawPath(instCourse,cam,'I');
 ball(course,t,'#ffffff');ball(instCourse,t,'#888888');
 X.restore();X.textAlign='left';
 X.fillStyle='#111c';X.fillRect(12,12,180,50);X.fillStyle='#fff';X.font='bold 12px Arial';X.fillText('WHITE = VOCALS',22,32);X.fillText('GRAY = INSTRUMENTAL',22,51);
 if(buf){X.fillStyle='#111c';X.fillRect(12,780,576,26);X.fillStyle='#fff';X.font='bold 12px Arial';X.fillText(fmt(t)+' / '+fmt(buf.duration),22,798)}
}
function drawIdle(){X.fillStyle='#ddd';X.fillRect(0,0,600,820);X.fillStyle='#777';X.textAlign='center';X.font='bold 22px Arial';X.fillText('LOAD BOTH STEMS',300,390);X.font='14px Arial';X.fillText('The course will be generated here.',300,420);X.textAlign='left'}
function fmt(s){s=Math.max(0,s||0);return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function setStart(v){
 if(!instBuf)return;
 startOffset=Math.max(0,Math.min(instBuf.duration-.05,Number(v)||0));
 SR.value=startOffset;SL.textContent=fmt(startOffset);
 if(!playing)draw(startOffset);
}
SR.oninput=()=>setStart(SR.value);
B15.onclick=()=>setStart(startOffset-15);
F15.onclick=()=>setStart(startOffset+15);
function noteName(m){let a=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];return a[((Math.round(m)%12)+12)%12]}
drawIdle();
</script></body></html>
